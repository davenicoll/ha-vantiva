name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach vantiva.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check manifest version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r .version custom_components/vantiva/manifest.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match manifest version $version" >&2
            exit 1
          fi

      - name: Zip integration
        run: |
          cd custom_components/vantiva
          zip -r "$GITHUB_WORKSPACE/vantiva.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" vantiva.zip --clobber --repo "$GITHUB_REPOSITORY"
